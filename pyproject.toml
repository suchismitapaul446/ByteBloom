[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bytebloom-language"
version = "1.0.0"
description = "A small educational custom scripting language"
requires-python = ">=3.9"

[project.scripts]
bytebloom = "bytebloom:main"

[tool.setuptools]
py-modules = ["bytebloom"]
